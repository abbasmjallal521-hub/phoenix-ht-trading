<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phoenix HT Trading</title>
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#12141d">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #12141d;
      color: #e2e8f0;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      font-size: 24px;
      color: #ff7b00;
      letter-spacing: 1px;
    }
    header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 5px;
    }
    .card {
      background: #1e2230;
      border: 1px solid #2d3448;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #38bdf8;
      border-bottom: 1px solid #2d3448;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #ff7b00;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .form-group {
      flex: 1;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff7b00, #e65100);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }
    .signal-item {
      background: #0f172a;
      border-right: 4px solid #38bdf8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .signal-item.BUY { border-right-color: #22c55e; }
    .signal-item.SELL { border-right-color: #ef4444; }
    
    .signal-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .signal-details {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .badge-buy { background: rgba(34,197,94,0.2); color: #22c55e; }
    .badge-sell { background: rgba(239,68,68,0.2); color: #ef4444; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔥 Phoenix HT Trading</h1>
    <p>نظام التوصيات المباشرة واللحظية</p>
  </header>

  <!-- Form Section -->
  <div class="card">
    <h2>إضافة توصية جديدة</h2>
    <form id="signalForm">
      <div class="row">
        <div class="form-group">
          <label>الزوج / الأداة</label>
          <input type="text" id="pair" value="XAUUSD" required>
        </div>
        <div class="form-group">
          <label>نوع الصفقة</label>
          <select id="type">
            <option value="BUY">شراء (BUY)</option>
            <option value="SELL">بيع (SELL)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>سعر الدخول (Entry)</label>
        <input type="number" step="any" id="entry" placeholder="2650.00" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label>الهدف (TP)</label>
          <input type="number" step="any" id="tp" placeholder="2665.00" required>
        </div>
        <div class="form-group">
          <label>الستوب (SL)</label>
          <input type="number" step="any" id="sl" placeholder="2640.00" required>
        </div>
      </div>

      <button type="submit" id="submitBtn">نشر التوصية وإرسالها للتليغرام 🚀</button>
      <div class="status" id="statusMsg"></div>
    </form>
  </div>

  <!-- Recent Signals Feed -->
  <div class="card">
    <h2>آخر التوصيات</h2>
    <div id="signalsList">
      <p style="text-align:center; color:#64748b; font-size:13px;">جاري تحميل التوصيات...</p>
    </div>
  </div>
</div>

<!-- Firebase Realtime Database SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 1. Firebase Config
  const firebaseConfig = {
    databaseURL: "https://phoenix-ht-trading-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 2. Telegram Integration
  const TELEGRAM_BOT_TOKEN = '8928207233:AAEVufaND2tca_8ZoC04_IllJzQUSpsMI_c';
  const TELEGRAM_CHAT_ID = '@phoenixhttrading';

  // Function to send signal to Telegram
  async function sendToTelegram(signal) {
    const icon = signal.type === 'BUY' ? '🟢' : '🔴';
    const messageText = 
      `${icon} **توصية جديدة - Phoenix HT Trading**\n\n` +
      `📊 **الزوج:** ${signal.pair}\n` +
      `📌 **النوع:** ${signal.type}\n` +
      `📍 **سعر الدخول:** ${signal.entry}\n` +
      `🎯 **الهدف (TP):** ${signal.tp}\n` +
      `🛑 **وقف الخسارة (SL):** ${signal.sl}\n\n` +
      `⏱ **الوقت:** ${new Date().toLocaleTimeString('ar-EG')}`;

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: messageText,
          parse_mode: 'Markdown'
        })
      });
      return true;
    } catch (err) {
      console.error("Telegram Error:", err);
      return false;
    }
  }

  // 3. Handle Form Submit
  const form = document.getElementById('signalForm');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.style.color = '#38bdf8';
    statusMsg.innerText = "جاري الحفظ والإرسال...";

    const signalData = {
      pair: document.getElementById('pair').value.toUpperCase(),
      type: document.getElementById('type').value,
      entry: document.getElementById('entry').value,
      tp: document.getElementById('tp').value,
      sl: document.getElementById('sl').value,
      timestamp: Date.now()
    };

    try {
      // Push to Firebase Realtime DB
      await db.ref('signals').push(signalData);
      
      // Send to Telegram Channel
      await sendToTelegram(signalData);

      statusMsg.style.color = '#22c55e';
      statusMsg.innerText = "✅ تم نشر التوصية وإرسالها للقناة بنجاح!";
      
      // Reset entry inputs
      document.getElementById('entry').value = '';
      document.getElementById('tp').value = '';
      document.getElementById('sl').value = '';
    } catch (err) {
      statusMsg.style.color = '#ef4444';
      statusMsg.innerText = "❌ حدث خطأ أثناء الحفظ!";
    }
  });

  // 4. Live Updates from Firebase
  db.ref('signals').limitToLast(10).on('value', (snapshot) => {
    const listContainer = document.getElementById('signalsList');
    listContainer.innerHTML = '';

    if (!snapshot.exists()) {
      listContainer.innerHTML = '<p style="text-align:center; color:#64748b;">لا توجد توصيات حالياً.</p>';
      return;
    }

    const data = snapshot.val();
    const items = Object.values(data).reverse();

    items.forEach(sig => {
      const isBuy = sig.type === 'BUY';
      const itemHTML = `
        <div class="signal-item ${sig.type}">
          <div class="signal-header">
            <span>${sig.pair}</span>
            <span class="badge ${isBuy ? 'badge-buy' : 'badge-sell'}">${sig.type}</span>
          </div>
          <div class="signal-details">
            <span>دخول: <b>${sig.entry}</b></span>
            <span>TP: <b>${sig.tp}</b></span>
            <span>SL: <b>${sig.sl}</b></span>
          </div>
        </div>
      `;
      listContainer.innerHTML += itemHTML;
    });
  });
</script>

</body>
</html>
