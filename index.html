<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phoenix HT Trading PRO</title>
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e14">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-card: #151924;
      --bg-input: #1c2230;
      --accent-orange: #ff7b00;
      --accent-blue: #38bdf8;
      --green-buy: #22c55e;
      --red-sell: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #262d3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 15px;
      padding: 10px 0;
    }

    header h1 {
      font-size: 22px;
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Navigation / Tabs */
    .nav-tabs {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--accent-orange);
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards & Containers */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 15px;
      color: var(--accent-blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-orange);
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-orange), #d97706);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .status-msg {
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
    }

    /* Chart Container */
    .chart-box {
      height: 380px;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Signals List */
    .signal-card {
      background: var(--bg-input);
      border-right: 4px solid var(--accent-blue);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .signal-card.BUY { border-right-color: var(--green-buy); }
    .signal-card.SELL { border-right-color: var(--red-sell); }

    .signal-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .signal-body {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .badge-buy { background: rgba(34, 197, 94, 0.2); color: var(--green-buy); }
    .badge-sell { background: rgba(239, 68, 68, 0.2); color: var(--red-sell); }

    /* Risk Calculator Output */
    .calc-result {
      background: var(--bg-input);
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      text-align: center;
    }

    .calc-result h3 {
      font-size: 18px;
      color: var(--accent-orange);
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1><i class="fa-solid fa-fire"></i> Phoenix HT Trading</h1>
    <p>SMC Signals & Market Intelligence</p>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('signals')"><i class="fa-solid fa-bolt"></i> التوصيات</button>
    <button class="tab-btn" onclick="switchTab('chart')"><i class="fa-solid fa-chart-line"></i> الشارت</button>
    <button class="tab-btn" onclick="switchTab('calc')"><i class="fa-solid fa-calculator"></i> المخاطرة</button>
  </div>

  <!-- TAB 1: SIGNALS -->
  <div id="tab-signals" class="tab-content active">
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-plus-circle"></i> إضافة توصية جديدة</div>
      <form id="signalForm">
        <div class="row">
          <div class="form-group">
            <label>الزوج</label>
            <input type="text" id="pair" value="XAUUSD" required>
          </div>
          <div class="form-group">
            <label>النوع</label>
            <select id="type">
              <option value="BUY">شراء (BUY)</option>
              <option value="SELL">بيع (SELL)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>سعر الدخول (Entry)</label>
          <input type="number" step="any" id="entry" placeholder="2650.00" required>
        </div>

        <div class="row">
          <div class="form-group">
            <label>الهدف (TP)</label>
            <input type="number" step="any" id="tp" placeholder="2665.00" required>
          </div>
          <div class="form-group">
            <label>الستوب (SL)</label>
            <input type="number" step="any" id="sl" placeholder="2640.00" required>
          </div>
        </div>

        <button type="submit" class="btn-submit"><i class="fa-paper-plane"></i> نشر وإرسال للتليغرام</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-list"></i> آخر التوصيات</div>
      <div id="signalsList">
        <p style="text-align:center; color:var(--text-muted); font-size:12px;">جاري تحميل التوصيات...</p>
      </div>
    </div>
  </div>

  <!-- TAB 2: CHART -->
  <div id="tab-chart" class="tab-content">
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-chart-candlestick"></i> شارت الذهب (XAUUSD) المباشر</div>
      <div class="chart-box">
        <!-- TradingView Widget -->
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div id="tradingview_chart" style="height:100%;width:100%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 3: RISK CALCULATOR -->
  <div id="tab-calc" class="tab-content">
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-calculator"></i> حاسبة إدارة المخاطر (Lot Size)</div>
      <div class="form-group">
        <label>رأس المال ($)</label>
        <input type="number" id="accSize" value="1000">
      </div>
      <div class="form-group">
        <label>نسبة المخاطرة (%)</label>
        <input type="number" id="riskPct" value="1" step="0.5">
      </div>
      <div class="form-group">
        <label>عدد نقاط الستوب (Pips)</label>
        <input type="number" id="stopPips" value="30">
      </div>
      <button type="button" class="btn-submit" onclick="calculateLot()"><i class="fa-solid fa-microchip"></i> احسب اللوت المناسب</button>

      <div class="calc-result" id="calcOutput">
        <p style="font-size:12px; color:var(--text-muted)">حجم العقد المقترح:</p>
        <h3 id="lotResult">0.00 Lot</h3>
      </div>
    </div>
  </div>
</div>

<!-- Firebase Realtime Database -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<!-- TradingView Widget -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<script>
  // 1. Firebase Setup
  const firebaseConfig = {
    databaseURL: "https://phoenix-ht-trading-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 2. Telegram Bot Config
  const TELEGRAM_BOT_TOKEN = '8928207233:AAEVufaND2tca_8ZoC04_IllJzQUSpsMI_c';
  const TELEGRAM_CHAT_ID = '@phoenixhttrading';

  // Tab Switcher
  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    event.currentTarget.classList.add('active');
    document.getElementById('tab-' + tabName).classList.add('active');

    if(tabName === 'chart') {
      loadChart();
    }
  }

  // TradingView Chart
  function loadChart() {
    new TradingView.widget({
      "autosize": true,
      "symbol": "OANDA:XAUUSD",
      "interval": "15",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "ar",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "hide_side_toolbar": false,
      "container_id": "tradingview_chart"
    });
  }

  // Telegram Send Function
  async function sendToTelegram(signal) {
    const icon = signal.type === 'BUY' ? '🟢' : '🔴';
    const messageText = 
      `${icon} **توصية جديدة - Phoenix HT Trading**\n\n` +
      `📊 **الزوج:** ${signal.pair}\n` +
      `📌 **النوع:** ${signal.type}\n` +
      `📍 **سعر الدخول:** ${signal.entry}\n` +
      `🎯 **الهدف (TP):** ${signal.tp}\n` +
      `🛑 **وقف الخسارة (SL):** ${signal.sl}\n\n` +
      `⏱ **الوقت:** ${new Date().toLocaleTimeString('ar-EG')}`;

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: messageText,
          parse_mode: 'Markdown'
        })
      });
    } catch (err) {
      console.error(err);
    }
  }

  // Submit Signal Form
  document.getElementById('signalForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.style.color = '#38bdf8';
    statusMsg.innerText = "جاري النشر والإرسال...";

    const signalData = {
      pair: document.getElementById('pair').value.toUpperCase(),
      type: document.getElementById('type').value,
      entry: document.getElementById('entry').value,
      tp: document.getElementById('tp').value,
      sl: document.getElementById('sl').value,
      timestamp: Date.now()
    };

    try {
      await db.ref('signals').push(signalData);
      await sendToTelegram(signalData);

      statusMsg.style.color = '#22c55e';
      statusMsg.innerText = "✅ تم نشر التوصية وإرسالها للتليغرام بنجاح!";

      document.getElementById('entry').value = '';
      document.getElementById('tp').value = '';
      document.getElementById('sl').value = '';
    } catch (err) {
      statusMsg.style.color = '#ef4444';
      statusMsg.innerText = "❌ حدث خطأ أثناء النشر!";
    }
  });

  // Listen to Live Signals
  db.ref('signals').limitToLast(10).on('value', (snapshot) => {
    const container = document.getElementById('signalsList');
    container.innerHTML = '';

    if (!snapshot.exists()) {
      container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد توصيات حالياً.</p>';
      return;
    }

    const items = Object.values(snapshot.val()).reverse();
    items.forEach(sig => {
      const isBuy = sig.type === 'BUY';
      container.innerHTML += `
        <div class="signal-card ${sig.type}">
          <div class="signal-header">
            <span>${sig.pair}</span>
            <span class="badge ${isBuy ? 'badge-buy' : 'badge-sell'}">${sig.type}</span>
          </div>
          <div class="signal-body">
            <span>دخول: <b>${sig.entry}</b></span>
            <span>TP: <b>${sig.tp}</b></span>
            <span>SL: <b>${sig.sl}</b></span>
          </div>
        </div>
      `;
    });
  });

  // Lot Calculator
  function calculateLot() {
    const balance = parseFloat(document.getElementById('accSize').value);
    const riskPct = parseFloat(document.getElementById('riskPct').value);
    const stopPips = parseFloat(document.getElementById('stopPips').value);

    if (balance && riskPct && stopPips) {
      const riskAmount = balance * (riskPct / 100);
      const lotSize = (riskAmount / (stopPips * 10)).toFixed(2);
      document.getElementById('lotResult').innerText = lotSize + " Lot";
    }
  }
</script>

</body>
</html>
